[project]
name = "xml-tools"
version = "0.2.0"
description = "Generic, config-driven XML formatter and an XPath uuid-stamper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["lxml>=6.0.2"]

[project.urls]
Homepage = "https://github.com/gigamonkey/xml-tools"
Repository = "https://github.com/gigamonkey/xml-tools"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
xml-format = "xml_tools.format_xml:main"
xml-identify = "xml_tools.identify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
